name: Review gate

# A required check on every pull request: green only when a reviewer named on
# the linked ticket has approved (or a /self-approve rule exception was recorded),
# and nobody named on it requested changes.
# Branch protection on main requires this check (see the wiki page GitHub-setup).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Review gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const tickets = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/tickets.cjs`);
            await tickets.reviewGate({ github, context, core });
