name: Deploy functional mockup to GitHub Pages

# Publishes the BlueRiver functional mockup (apps/demo-bank), in browser mode
# (CSV files from data/ bundled into the page), to the gh-pages branch:
#
#   main               → https://adventurer-e.github.io/FamilyShield/
#   pull request #N    → https://adventurer-e.github.io/FamilyShield/pr-preview/pr-N/
#
# Each pull request gets a bot comment with its preview link, updated on every
# push and removed when the pull request is closed or merged.
#
# One-time setup: Settings → Pages → Build and deployment →
#   Source: "Deploy from a branch", Branch: gh-pages, Folder: / (root)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch: # also started by the ticket bot after it merges a pull request
    inputs:
      remove_preview:
        description: Pull request number whose preview to remove (the bot sets this after merging)
        required: false
        default: ''

permissions:
  contents: write # push to gh-pages
  pull-requests: write # comment the preview link

# One deploy at a time so pushes to gh-pages never race; queue, don't cancel.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token, so they can't publish previews.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Build functional mockup
        if: github.event.action != 'closed'
        run: |
          npm install --no-audit --no-fund
          npm run build -w @familyshield/demo-bank
          touch apps/demo-bank/dist/.nojekyll

      - name: Publish main site
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/demo-bank/dist
          clean-exclude: pr-preview/

      - name: Remove the preview of a pull request the ticket bot merged
        # A merge by the bot doesn't send the "closed" event that normally removes it.
        if: github.event_name == 'workflow_dispatch' && inputs.remove_preview != ''
        env:
          PR: ${{ inputs.remove_preview }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Not a pull request number: $PR"; exit 1; }
          git fetch --depth 1 origin gh-pages
          git worktree add --detach ../gh-pages FETCH_HEAD
          cd ../gh-pages
          if [ -d "pr-preview/pr-$PR" ]; then
            git rm -rq "pr-preview/pr-$PR"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Remove preview for pull request #$PR"
            git push origin HEAD:gh-pages
          else
            echo "No preview for #$PR"
          fi

      - name: Publish or remove pull request preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/demo-bank/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
