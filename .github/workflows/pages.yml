name: Deploy demo to GitHub Pages

# Publishes the BlueRiver demo bank (apps/demo-bank) at
# https://adventurer-e.github.io/FamilyShield/ on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build demo bank
        run: npm run build -w @familyshield/demo-bank
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo-bank/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
