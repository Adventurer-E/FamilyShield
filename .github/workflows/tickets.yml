name: Tickets

# Runs the Kanban workflow (see the wiki page Team-workflow):
#   ticket commands (/start, /reviewer …), status labels + board column,
#   a branch per ticket, review requests, the merge-by-reviewer reminder,
#   /self-approve exceptions on pull requests, a record of direct pushes to main,
#   and the automatic merge of approved pull requests once every check is green.
# Logic and tests: .github/scripts/tickets.cjs, tickets.test.cjs

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, edited, closed]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main] # direct pushes are recorded as rule exceptions
  workflow_run: # checks that finish after the approval: merge then
    workflows: [CI, Deploy to GitHub Pages]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *' # pick up cards dragged on the board
  workflow_dispatch:

permissions:
  contents: write # create ticket branches, merge approved pull requests
  issues: write # labels, comments, assignees
  pull-requests: write # request reviewers, link tickets
  actions: write # re-run the Review gate after approval; start CI and Pages after a merge

concurrency:
  group: tickets-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'board' }}
  cancel-in-progress: false

jobs:
  tickets:
    runs-on: ubuntu-latest
    # Board sync only matters once the board is connected. Pull requests from forks get a read-only token.
    if: >-
      (github.event_name != 'schedule' || vars.PROJECT_NUMBER != '') &&
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          script: |
            const tickets = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/tickets.cjs`);
            await tickets.main({
              github, context, core,
              projectToken: process.env.PROJECT_TOKEN,
              projectNumber: process.env.PROJECT_NUMBER,
            });
