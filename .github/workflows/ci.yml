name: CI

# Continuous integration: every pull request and every push to main must pass
# these before merging (branch protection requires the "Checks" job).
# Run the same thing locally with: npm run check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by the ticket bot after it merges a pull request

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test ticket automation
        run: npm run test:automation
      - name: Build
        run: npm run build
