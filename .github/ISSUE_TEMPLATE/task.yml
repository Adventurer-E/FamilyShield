name: Task
description: A piece of work for the board (feature, change, bug, docs…)
labels: ['status: icebox']
body:
  - type: markdown
    attributes:
      value: |
        New tickets start in **Icebox**. When someone picks it up, they comment `/start` (or drag the card to **In progress**), and a branch is created.
        Not sure what to write? See [How we work as a team](https://github.com/Adventurer-E/FamilyShield/wiki/Team-workflow).
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What should change, and why does it matter? Plain words are fine.
      placeholder: On the Repay screen, show the date of the last payment, so borrowers know their payment went through.
    validations:
      required: true

  # TEAM LIST: when someone joins, add "- '@their-github-name'" to BOTH lists below.
  # Keep "Nobody yet (decide later)" first.
  - type: dropdown
    id: assignee
    attributes:
      label: Assignee
      description: Who will do the work? Anyone can change it later (`/assign me`, `/reassign @name`).
      options:
        - Nobody yet (decide later)
        - '@Adventurer-E'
      default: 0
  - type: dropdown
    id: reviewer
    attributes:
      label: Reviewer
      description: Who will review and merge it? In principle, not the assignee. Change it later with `/reviewer @name` or `/review`.
      options:
        - Nobody yet (decide later)
        - '@Adventurer-E'
      default: 0
